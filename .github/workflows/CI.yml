name: CI/cd Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  train-and-test:
    runs-on : ubuntu-latest  
    steps:
       - name: Download  Project code    
         uses: actions/checkout@v4
       - name: Set up Python 
         uses: actions/setup-python@v5   
         with: 
            python-version: "3.11"
       - name: Install dependencies
         run: pip install -r requirements.txt

       - name: Train model
         run: python train.py

       - name: Run tests
         run: python test.py
